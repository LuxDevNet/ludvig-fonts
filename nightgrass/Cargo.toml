[package]
name = "nightgrass"
version = "0.2.0"
edition = "2021"

[[bin]]
name = "Nightgrass"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
winit = "0.30"
wry = "0.57.2"

[profile.release]
strip = true
lto = false
codegen-units = 16
