<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nightgrass</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23041614'/%3E%3Cpath d='M8 26 C9 16 11 12 10 6' stroke='%23e4ff6a' stroke-width='2' fill='none'/%3E%3Cpath d='M16 27 C16 16 18 11 17 5' stroke='%231f8f62' stroke-width='2' fill='none'/%3E%3Cpath d='M23 26 C22 18 25 14 24 8' stroke='%239be7c8' stroke-width='2' fill='none'/%3E%3Ccircle cx='24' cy='8' r='2' fill='%23f4fff8'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/meadow.css" />
  </head>
  <body>
    <div class="sky" aria-hidden="true"></div>
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <span class="dew" aria-hidden="true"></span>
          <div>
            <p class="wordmark">Nightgrass</p>
            <p class="lede" id="lede">Choose a folder and the faces stream in.</p>
          </div>
        </div>
        <label class="search">
          <span class="sr">Search faces</span>
          <input id="search" type="search" placeholder="Search faces" autocomplete="off" />
        </label>
        <button class="primary" id="pick" type="button">Choose folder</button>
      </header>
      <div class="workspace">
        <aside class="rail" id="rail">
          <div class="roots" id="roots"></div>
          <details class="path-box">
            <summary>Paste a folder path</summary>
            <form id="path-form">
              <input id="path-input" type="text" placeholder="Z:\fonts\unzipped-fonts" spellcheck="false" />
              <button type="submit">Add path</button>
            </form>
          </details>
          <p class="note" id="note" role="status"></p>
          <div id="list"></div>
        </aside>
        <main class="stage" id="stage" data-ink="mist">
          <div class="sheet-wrap">
            <div class="stage-head">
              <div>
                <h1 id="face-name">No face yet</h1>
                <p id="face-meta"></p>
              </div>
              <div class="tools" role="group" aria-label="Sample">
                <button type="button" data-preset="night">Night line</button>
                <button type="button" data-preset="pangram">Pangram</button>
                <button type="button" data-preset="reading">Reading</button>
                <button type="button" data-preset="figures">Figures</button>
              </div>
            </div>
            <div class="controls">
              <label>Size <input id="size" type="range" min="28" max="200" value="92" /></label>
              <label>Spacing <input id="track" type="range" min="-40" max="200" value="0" /></label>
              <label>Leading <input id="lead" type="range" min="80" max="160" value="96" /></label>
              <div class="tools" role="group" aria-label="Ink">
                <button type="button" id="ink-mist" aria-pressed="true">Mist</button>
                <button type="button" id="ink-dew" aria-pressed="false">Dew paper</button>
              </div>
              <div class="tools" role="group" aria-label="Alignment">
                <button type="button" id="align-left" aria-pressed="true">Left</button>
                <button type="button" id="align-center" aria-pressed="false">Center</button>
              </div>
              <button type="button" id="hold">Hold this face</button>
            </div>
            <div class="held" id="held"></div>
            <p id="status" class="status" role="status"></p>
            <div
              id="specimen"
              class="specimen"
              contenteditable="true"
              role="textbox"
              aria-label="Sample text"
              spellcheck="false"
            ></div>
            <p id="alphabet" class="alphabet">Aa Bb Cc Dd Ee Ff Gg Hh Ii Jj Kk Ll Mm Nn Oo Pp Qq Rr Ss Tt Uu Vv Ww Xx Yy Zz 0123456789</p>
          </div>
          <div class="ground" id="ground" aria-hidden="true"></div>
        </main>
      </div>
    </div>
    <script src="/app.js"></script>
  </body>
</html>
